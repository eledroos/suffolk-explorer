<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Client-side explorer for Suffolk County DA charge-level data, 2022-2025. Filings, dispositions, filters, and custom categories, all in the browser." />
    <title>Suffolk DA Explorer</title>
    <!-- The three-bar wordmark, in the contract's series colors. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1.5' y='8' width='3.4' height='7' rx='0.8' fill='%232a78d6'/%3E%3Crect x='6.3' y='1' width='3.4' height='14' rx='0.8' fill='%23eb6834'/%3E%3Crect x='11.1' y='4.5' width='3.4' height='10.5' rx='0.8' fill='%231baf7a'/%3E%3C/svg%3E" />
    <script>
      // Set theme before first paint to avoid a flash. Mirrors the logic in src/ui/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem('suffolk-explorer-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
